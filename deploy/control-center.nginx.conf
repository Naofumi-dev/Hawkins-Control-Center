server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = / {
        proxy_pass http://client-finder:8088;
        proxy_set_header Host $host;
        proxy_read_timeout 45s;
    }
    location ~ ^/(api/|assets/) {
        proxy_pass http://client-finder:8088;
        proxy_set_header Host $host;
        proxy_read_timeout 45s;
    }
    # Internal scheduler, card, Gmail and model endpoints have no public route.
    location / { return 404; }
}
